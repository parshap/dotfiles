# Vi-style bindings
set -g status-keys vi
setw -g mode-keys vi

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",*256col*:RGB"

# Extended keys (CSI u) so apps can see modified keys like C-S-j, and
# advertise the capability to the outer terminal so tmux forwards them.
# tmux defaults the report format to xterm's formatOtherKeys style; most
# modern TUIs want the CSI u form.
#
# TODO: tmux 3.8 declares extkeys for ghostty itself, so revisit the
# xterm* line then — keep it only if another xterm* terminal needs it.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys"

# Ghostty supports more than its terminfo entry declares (no Hls, Swd,
# Enbp, Cmg, Smol or Spb), and tmux 3.7 doesn't recognise ghostty's
# XTVERSION reply, so none of it is auto-detected.
#
# TODO: tmux master (3.8+) has a built-in ghostty feature set covering
# everything below except margins. Once the installed tmux auto-detects
# it, check `tmux show -A terminal-features` and drop this line.
set -as terminal-features ",xterm-ghostty:hyperlinks:osc7:bpaste:margins:overline:progressbar"

# Let the shell set window names (oh-my-zsh sends directory at the
# prompt and the command name during execution via escape sequences)
set -g allow-rename on
setw -g automatic-rename off

# Set terminal title to current window name
set -g set-titles on
set -g set-titles-string "#{host_short}:#{session_name}:#{window_name}"

# Reduce escape delay (important for vim)
set -sg escape-time 10

# Enable focus events (needed for vim autoread)
set -g focus-events on

# Scrollback, and persist command-prompt history across restarts
set -g history-limit 50000
set -g history-file ~/.tmux_history

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# With multiple attached clients, size each window to the clients actually
# viewing it rather than the smallest client on the session
setw -g aggressive-resize on

# Activity monitoring
setw -g monitor-activity on

# Allow OSC passthrough so apps can query terminal colors (e.g. OSC 11
# for light/dark theme auto-detection in Claude Code)
set -g allow-passthrough on

# Clipboard via OSC 52 (works with iTerm2, Alacritty, kitty, etc.)
set -g set-clipboard on

# Let applications read the clipboard via an OSC 52 query. Requires
# `clipboard-read = allow` (or ask) in the ghostty config.
set -g get-clipboard both

# Local fallback for copy-pipe when OSC 52 isn't in play
set -g copy-command 'pbcopy'

# Mouse
set -g mouse on
bind m set -g mouse on \; display "Mouse: ON"
bind M set -g mouse off \; display "Mouse: OFF"

# Theme
source-file ~/.tmux-theme-selenized.conf

# Open new panes/windows in the current working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vi-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Active layered tmux fragments. Extend via a source listed by
# `dotfiles-layer explain tmux-fragments`; tmux performs final composition.
source-file -q ~/.local/state/dotfiles-layer/native/tmux-fragments/loader.conf
