#### COLOUR — Selenized (works with both light and dark terminal themes)
#
# In selenized, ANSI 0 (black) = bg_1 and ANSI 8 (brightblack) = bg_2 in
# both light and dark variants. This means these colors always represent
# "slightly off-background" shades, perfect for UI chrome.
#
#   black      = bg_1  (status bar, UI elements)
#   brightblack = bg_2  (highlights, active selections)
#   white      = dim_0 (muted/secondary text)

# default statusbar colors — bg_1 gives subtle off-background
set-option -g status-style fg=yellow,bg=black

# default window title colors — dim_0 for muted inactive windows
set-window-option -g window-status-style fg=white

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bold

# pane border — bg_2 is visible but subtle in both themes
set-option -g pane-border-style fg=brightblack
set-option -g pane-active-border-style fg=cyan

# message text
set-option -g message-style fg=brightred,bg=black

# pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# clock
set-window-option -g clock-mode-colour green

# activity — colour245 is slightly brighter than dim_0 in dark,
# slightly darker in light, so it subtly stands out in both
set-window-option -g window-status-activity-style fg=colour245,bold

# bell
set-window-option -g window-status-bell-style fg=red,bold,reverse

# Drop flag characters — current/activity/bell already have distinct styles
set-window-option -g window-status-format "#I:#W"
set-window-option -g window-status-current-format "#I:#W"
